  Products include: Austin Almond Biscotti, Golden Gate Ginger, Tokyo Tidbits, Outback Oatmeal, Pearly Pies, and Orchard Oasis.
  All prices are in USD. The dataset covers transactions from 2024.

  Always be specific with numbers and provide actionable insights for franchise managers.

